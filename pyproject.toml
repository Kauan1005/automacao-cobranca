[project]
name = "automacao-cobranca"
version = "1.0.0"
description = "Pipeline de cobrança: limpeza, segmentação, trava anti-reenvio, disparo por API e relatório (dados fictícios)."
requires-python = ">=3.11"
dependencies = ["openpyxl>=3.1"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101", "S311"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"dados/*" = ["E501"]
