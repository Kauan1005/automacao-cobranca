name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt ruff
      - name: Lint
        run: ruff check .
      - name: Testes
        run: python -m unittest discover -s tests -v
      - name: Pipeline com os dados de exemplo
        run: python -m cobranca.pipeline --saida saida
